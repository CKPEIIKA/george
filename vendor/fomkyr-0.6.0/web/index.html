<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>fomkyr browser diagnostic</title><script type="module" src="./demo.js"></script></head><body>
<h1>fomkyr 0.4.0: browser diagnostic</h1>
<p>This page tests the backend; George remains the main frontend.</p>
<p id="context"></p>
<label>Degree (blank = completion) <input id="degree" type="number" min="1" value="7"></label>
<label>Workers (0 = auto) <input id="workers" type="number" min="0" max="32" value="4"></label>
<label>Memory ABI <select id="bits"><option value="auto">automatic</option><option>32</option><option>64</option></select></label>
<label>Execution <select id="execution"><option value="auto">automatic</option><option value="single">single worker</option><option value="multicore">require multicore</option></select></label>
<label><input id="spill" type="checkbox" checked>OPFS</label>
<label><input id="pruning" type="checkbox" checked>Monomial pruning</label>
<p><button id="run">Run exact Q example</button><button id="stop">Cancel</button><button id="isolate">Enable static-host multicore (one reload)</button></p>
<pre id="log"></pre></body></html>
