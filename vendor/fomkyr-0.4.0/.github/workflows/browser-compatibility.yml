name: Browser compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      # Prebuilt binaries are deliberately tested; no successful C build can
      # substitute for execution in the browser shipped by Playwright.
      - run: python tests/test_browsers.py --browser ${{ matrix.browser }} --report results/browser-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: results/browser-${{ matrix.browser }}.json
